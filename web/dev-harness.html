<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Fosforescent sample</title></head>
<body><div id="app"></div>
<script type="module">
import { App } from '/src/app.ts'
import { mountUi } from '/src/ui.ts'
import { createMemoryStorage } from '/src/storage.ts'
import { parseRowInput } from '/src/rows.ts'
import '/src/style.css'
const app = new App({ baseUrl: 'http://localhost', autoLogin: null, storage: createMemoryStorage() }); app.scheduleSync = () => {}
mountUi(document.getElementById('app'), app)
const home = app.state.view
const trip = app.applyConstructor(home, { kind: 'task', text: 'Plan the group trip', done: false })
app.applyConstructor(trip, { kind: 'task', text: 'Book flights', done: true })
app.applyConstructor(trip, { kind: 'note', text: 'Everyone arrives Friday; dinner at 8' })
const lodging = app.applyConstructor(trip, { kind: 'task', text: 'Reserve lodging', done: false })
app.applyConstructor(lodging, { kind: 'requirement', text: 'deposit', extras: { requirement: { capability: 'allocation', resource: 'account', amount: 300, unit: '$' } } })
app.applyConstructor(home, { kind: 'task', text: 'Ship the sync release', done: false })
app.applyConstructor(home, { kind: 'plain', text: 'Ideas for later' })
app.applyConstructor(home, { kind: 'template', text: 'Implement and verify' })
const params = new URLSearchParams(location.search)
if (params.has('open')) app.goTo(trip)
if (params.has('root')) app.goToRoot()
if (params.has('account')) app.goToAccountPeer()
if (params.has('register')) { app.setAuthFlow({ phase: 'register' }); app.goToAccountPeer() }
if (params.has('confirm')) { app.setAuthFlow({ phase: 'confirm', username: 'new-user', channel: 'email', destination: 'ne…@example.com' }); app.goToAccountPeer() }
app.refresh()
</script></body></html>
