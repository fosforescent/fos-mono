name: iOS Build & Publish

# Builds the Tauri iOS app wrapping the web/ frontend.
# - Tag push (v*): build AND publish to TestFlight
# - workflow_dispatch: build artifact only, unless `publish` is checked
#
# Required secrets/variables: see docs/mobile-release.md

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to TestFlight (unchecked = build artifact only)'
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  ios:
    name: iOS Build & Publish
    runs-on: macos-latest
    env:
      # Job-wide: must be set during `tauri ios init` (baked into the Xcode project)
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install workspace dependencies (tauri CLI)
        run: npm ci

      - name: Install web dependencies
        run: cd web && npm ci

      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo -n "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey_${APPLE_API_KEY_ID}.p8"

      - name: Initialize iOS project
        run: cd desktop && npx tauri ios init

      - name: Generate icons
        run: cd desktop && npx tauri icon src-tauri/app-icon.png

      - name: Build iOS IPA (manual signing via distribution cert + profile)
        env:
          # Tauri CLI imports these into a temp keychain and installs the profile.
          # See docs/mobile-release.md for how these assets were created.
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
          VITE_API_URL: ${{ vars.MOBILE_API_URL || 'https://api.fosforescent.com' }}
        run: cd desktop && npx tauri ios build --export-method app-store-connect

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: desktop/src-tauri/gen/apple/build/**/*.ipa

      - name: Upload to App Store Connect (TestFlight)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          mkdir -p ~/private_keys
          cp "$RUNNER_TEMP/keys/AuthKey_${APPLE_API_KEY_ID}.p8" ~/private_keys/
          xcrun altool --upload-app \
            --type ios \
            --file "$(find desktop/src-tauri/gen/apple/build -name '*.ipa' | head -1)" \
            --apiKey "$APPLE_API_KEY_ID" \
            --apiIssuer "$APPLE_API_ISSUER"
