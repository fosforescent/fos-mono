name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'infra/terraform/**'
  pull_request:
    branches: [main]
    paths:
      - 'infra/terraform/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      action:
        description: 'Terraform action'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy

env:
  TF_VAR_environment: ${{ github.event.inputs.environment || 'dev' }}
  TF_VAR_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_TERRAFORM_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      # locals.tf reads secret values (Stripe, JWT, Postmark, …) via file("../.env"), i.e. infra/.env
      # (a symlink to the repo-root .env locally); in CI it comes from the TF_DOTENV secret.
      - name: Write .env for Terraform locals
        working-directory: infra
        env:
          TF_DOTENV: ${{ secrets.TF_DOTENV }}
        run: |
          if [ -z "$TF_DOTENV" ]; then echo "TF_DOTENV secret is not set"; exit 1; fi
          rm -f .env
          printf '%s\n' "$TF_DOTENV" > .env
          echo "wrote infra/.env ($(grep -c '^[A-Z_0-9]*=' .env) entries)"

      # Required variables (gcp_project_id, db_password, …) come from the TF_TFVARS secret
      # (the gitignored terraform.tfvars). Its `environment` line is dropped so TF_VAR_environment wins.
      - name: Write terraform.tfvars
        env:
          TF_TFVARS: ${{ secrets.TF_TFVARS }}
        run: |
          if [ -z "$TF_TFVARS" ]; then echo "TF_TFVARS secret is not set"; exit 1; fi
          printf '%s\n' "$TF_TFVARS" | grep -v '^[[:space:]]*environment[[:space:]]*=' > terraform.tfvars
          echo "wrote terraform.tfvars ($(grep -c '=' terraform.tfvars) variables)"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6.3"
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init
        
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -out=tfplan
        continue-on-error: false

      - name: Update Pull Request
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            
            // Get plan output
            const planOutput = execSync('cd infra/terraform && terraform show -no-color tfplan', { encoding: 'utf-8' });
            
            const output = `#### Terraform Plan 📖
            
            <details><summary>Show Plan</summary>
            
            \`\`\`terraform
            ${planOutput}
            \`\`\`
            
            </details>
            
            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Terraform Apply
        if: |
          (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
        run: terraform apply -auto-approve tfplan

      - name: Terraform Destroy
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        run: terraform destroy -auto-approve

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terraform-plan-${{ env.TF_VAR_environment }}
          path: infra/terraform/tfplan
          retention-days: 30