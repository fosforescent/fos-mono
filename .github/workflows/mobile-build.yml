name: Mobile Build & Publish

# Builds the Tauri app for Android and iOS, wrapping the web/ frontend.
# - Tag push (v*): build AND publish to Play internal track + TestFlight
# - workflow_dispatch: build artifacts only, unless `publish` is checked
#
# Required secrets/variables: see docs/mobile-release.md

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to stores (unchecked = build artifacts only)'
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ===========================================
  # Android: Build and Publish to Play Store
  # ===========================================
  android:
    name: Android Build & Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;26.1.10909125"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install workspace dependencies (tauri CLI)
        run: npm ci

      - name: Install web dependencies
        run: cd web && npm ci

      - name: Initialize Android project
        run: cd desktop && npx tauri android init

      - name: Generate icons
        run: cd desktop && npx tauri icon src-tauri/app-icon.png

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash .github/scripts/patch-android-signing.sh

      - name: Build Android AAB (signed)
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
          VITE_API_URL: ${{ vars.MOBILE_API_URL || 'https://api.fosforescent.com' }}
        run: cd desktop && npx tauri android build --aab --target aarch64 --target armv7

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: desktop/src-tauri/gen/android/app/build/outputs/bundle/universalRelease/*.aab

      - name: Publish to Google Play Store (internal track)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.fosforescent.app
          releaseFiles: desktop/src-tauri/gen/android/app/build/outputs/bundle/universalRelease/*.aab
          track: internal
          status: completed

  # ===========================================
  # iOS: Build and Publish to TestFlight
  # ===========================================
  ios:
    name: iOS Build & Publish
    runs-on: macos-latest
    env:
      # Job-wide: must be set during `tauri ios init` (baked into the Xcode project)
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install workspace dependencies (tauri CLI)
        run: npm ci

      - name: Install web dependencies
        run: cd web && npm ci

      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo -n "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey_${APPLE_API_KEY_ID}.p8"

      - name: Initialize iOS project
        run: cd desktop && npx tauri ios init

      - name: Generate icons
        run: cd desktop && npx tauri icon src-tauri/app-icon.png

      - name: Build iOS IPA (automatic signing via App Store Connect API key)
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          VITE_API_URL: ${{ vars.MOBILE_API_URL || 'https://api.fosforescent.com' }}
        run: cd desktop && npx tauri ios build --export-method app-store-connect

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: desktop/src-tauri/gen/apple/build/**/*.ipa

      - name: Upload to App Store Connect (TestFlight)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          mkdir -p ~/private_keys
          cp "$RUNNER_TEMP/keys/AuthKey_${APPLE_API_KEY_ID}.p8" ~/private_keys/
          xcrun altool --upload-app \
            --type ios \
            --file "$(find desktop/src-tauri/gen/apple/build -name '*.ipa' | head -1)" \
            --apiKey "$APPLE_API_KEY_ID" \
            --apiIssuer "$APPLE_API_ISSUER"
