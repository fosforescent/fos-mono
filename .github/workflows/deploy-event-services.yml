name: Deploy Event Services

on:
  push:
    branches: [main]
    paths:
      - 'event-services/**'
  pull_request:
    branches: [main]
    paths:
      - 'event-services/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    name: Build and Test Event Services
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for WhatsApp service
        id: whatsapp-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/whatsapp-service
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract metadata for Discord service
        id: discord-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/discord-service
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build WhatsApp service image
        uses: docker/build-push-action@v5
        with:
          context: ./event-services/whatsapp
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.whatsapp-meta.outputs.tags }}
          labels: ${{ steps.whatsapp-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Discord service image
        uses: docker/build-push-action@v5
        with:
          context: ./event-services/discord
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.discord-meta.outputs.tags }}
          labels: ${{ steps.discord-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy Event Services
    needs: [build-and-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    environment: ${{ github.event.inputs.environment || 'dev' }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials for Event Services
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.EVENT_SERVICES_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.EVENT_SERVICES_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Create deployment environment file
        run: |
          cat > event-services/.env << EOF
          # AWS Configuration
          AWS_REGION=${{ secrets.AWS_REGION || 'us-east-1' }}
          AWS_ACCESS_KEY_ID=${{ secrets.EVENT_SERVICES_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.EVENT_SERVICES_AWS_SECRET_ACCESS_KEY }}
          INBOX_QUEUE_URL=${{ secrets.INBOX_QUEUE_URL }}
          OUTBOX_QUEUE_URL=${{ secrets.OUTBOX_QUEUE_URL }}
          
          # WhatsApp Business API Configuration
          WHATSAPP_TOKEN=${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID=${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WEBHOOK_VERIFY_TOKEN=${{ secrets.WEBHOOK_VERIFY_TOKEN }}
          
          # Discord Bot Configuration
          DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}
          EOF

      - name: Test SQS Connectivity
        run: |
          # Test if we can access the SQS queues
          aws sqs get-queue-attributes \
            --queue-url ${{ secrets.INBOX_QUEUE_URL }} \
            --attribute-names All
          
          aws sqs get-queue-attributes \
            --queue-url ${{ secrets.OUTBOX_QUEUE_URL }} \
            --attribute-names All

      - name: Deploy with Docker Compose
        run: |
          cd event-services
          
          # Pull latest images
          docker compose pull || true
          
          # Deploy services
          docker compose up -d
          
          # Wait for services to be healthy
          echo "Waiting for services to be healthy..."
          for i in {1..30}; do
            if docker compose ps | grep -q "healthy"; then
              echo "Services are healthy"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 10
          done
          
          # Show status
          docker compose ps

      - name: Run Health Checks
        run: |
          # Wait for services to start
          sleep 15
          
          # Health check for WhatsApp service
          curl -f http://localhost:3000/health || exit 1
          
          # Health check for Discord service  
          curl -f http://localhost:3001/health || exit 1
          
          echo "✅ All services are healthy"

      - name: Create deployment summary
        run: |
          echo "## Event Services Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Services Deployed:" >> $GITHUB_STEP_SUMMARY
          echo "- 🟢 WhatsApp Echo Service (Port 3000)" >> $GITHUB_STEP_SUMMARY
          echo "- 🟢 Discord Echo Service (Port 3001)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Environment: ${{ github.event.inputs.environment || 'dev' }}" >> $GITHUB_STEP_SUMMARY
          echo "### AWS Region: ${{ secrets.AWS_REGION || 'us-east-1' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Docker Images:" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/whatsapp-service:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/discord-service:latest\`" >> $GITHUB_STEP_SUMMARY