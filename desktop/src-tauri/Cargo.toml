[package]
name = "fos"
version = "0.1.1"
description = "Fosforescent - Workflow CLI and Desktop App"
authors = []
license = "MIT"
repository = "https://github.com/fosforescent/fos-mono"
edition = "2021"
rust-version = "1.80"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# CLI/REPL mode: the TypeScript sync core runs in-process (QuickJS); HTTP for the account and the local server
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
dirs = "5.0"
open = "5"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
colored = "2"
rustyline = "14"
rusqlite = { version = "0.31", features = ["bundled"] }

# WebRTC for peer-to-peer connections
webrtc = "0.11"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
base64 = "0.22"

# Cryptographic signing for peer verification
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"

[target.'cfg(target_os = "ios")'.dependencies]
# iOS-specific dependencies if needed

[target.'cfg(target_os = "android")'.dependencies]
# Android-specific dependencies if needed

[features]
# Enable custom protocol for mobile deep linking
custom-protocol = ["tauri/custom-protocol"]

# CLI/REPL mode only (QuickJS core, account client, local server, config). The mobile
# apps are GUI-only and rquickjs-sys has no prebuilt bindings for iOS/Android, so these
# are compiled for desktop targets exclusively.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rquickjs = { version = "0.14", features = ["classes", "properties", "parallel"] }
ureq = { version = "3", features = ["json"] }
tiny_http = "0.12"
toml = "1"
