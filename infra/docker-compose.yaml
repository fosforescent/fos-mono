services:
  # PostgreSQL database with pgvector extension
  postgres:
    image: pgvector/pgvector:pg15
    container_name: fos-postgres
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fosdev}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./prisma/init_vector.sql:/docker-entrypoint-initdb.d/init_vector.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles:
      - db-only
      - full

  # Qdrant vector database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: fos-qdrant
    env_file:
      - ../.env
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - db-only
      - full

  # Temporal database (separate from main app database)
  temporal-postgres:
    image: postgres:13
    container_name: temporal-postgres
    environment:
      POSTGRES_DB: temporal
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    ports:
      - "5433:5432"
    volumes:
      - temporal_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles:
      - temporal
      - full

  # Temporal server
  temporal:
    image: temporalio/auto-setup:1.22.4
    container_name: temporal
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgres
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"   # gRPC port
      - "8233:8233"   # HTTP API port
    volumes:
      - ./temporal/dynamicconfig:/etc/temporal/config/dynamicconfig
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "workflow", "list"]
      interval: 30s
      timeout: 5s
      retries: 5
    profiles:
      - temporal
      - full

  # Temporal UI
  temporal-ui:
    image: temporalio/ui:2.21.3
    container_name: temporal-ui
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000,http://localhost:8080
    ports:
      - "8080:8080"
    profiles:
      - temporal
      - full

  # Temporal Worker (for executing workflows)
  temporal-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile.temporal-worker
    container_name: temporal-worker
    depends_on:
      temporal:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      - TEMPORAL_SERVER_HOST=temporal:7233
      - NODE_ENV=development
    volumes:
      - ../backend:/app
      - /app/node_modules
    profiles:
      - temporal
      - full

  # Fosforescent backend (using Dockerfile)
  backend:
    build:
      context: ../
      dockerfile: backend/Dockerfile
    container_name: fos-backend
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-fosdev}?connection_limit=5
      - JWT_SECRET=myjwtsecret
      - PORT=${BACKEND_PORT:-4000}
      - STRIPE_TOKEN=${STRIPE_TOKEN}
      - STRIPE_SUBSCRIPTION_PRICE_ID=${STRIPE_SUBSCRIPTION_PRICE_ID}
      - STRIPE_TOPUP_PRICE_ID=${STRIPE_TOPUP_PRICE_ID}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - POSTMARK_API_TOKEN=${POSTMARK_API_TOKEN}
      - EMAIL_WEBHOOK_PASSWORD=${EMAIL_WEBHOOK_PASSWORD}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - TEMPORAL_SERVER_HOST=temporal:7233
      - NODE_ENV=${NODE_ENV:-production}
    ports:
      - "${BACKEND_PORT:-4000}:80"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - full

  # Frontend (using Dockerfile)
  frontend:
    build:
      context: ../
      dockerfile: frontend/Dockerfile
    container_name: fos-frontend
    env_file:
      - ../.env
    environment:
      - VITE_FOS_API_URL=http://backend:80
      - NODE_ENV=${NODE_ENV:-production}
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    profiles:
      - full

volumes:
  postgres_data:
  qdrant_data:
  temporal_data:

# Networks (optional, for custom networking)
networks:
  default:
    name: fos-network