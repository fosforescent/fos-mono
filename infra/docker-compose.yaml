services:
  # PostgreSQL database with pgvector extension
  postgres:
    image: pgvector/pgvector:pg15
    container_name: fos-postgres
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fosdev}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../prisma/init_vector.sql:/docker-entrypoint-initdb.d/init_vector.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Qdrant vector database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: fos-qdrant
    env_file:
      - ../.env
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Fosforescent backend (using Dockerfile)
  backend:
    build:
      context: ../
      dockerfile: backend/Dockerfile
    container_name: fos-backend
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-fosdev}?connection_limit=5
      - JWT_SECRET=myjwtsecret
      - PORT=${BACKEND_PORT:-4000}
      - STRIPE_TOKEN=${STRIPE_TOKEN}
      - STRIPE_SUBSCRIPTION_PRICE_ID=${STRIPE_SUBSCRIPTION_PRICE_ID}
      - STRIPE_TOPUP_PRICE_ID=${STRIPE_TOPUP_PRICE_ID}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - POSTMARK_API_TOKEN=${POSTMARK_API_TOKEN}
      - EMAIL_WEBHOOK_PASSWORD=${EMAIL_WEBHOOK_PASSWORD}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - NODE_ENV=${NODE_ENV:-production}
    ports:
      - "${BACKEND_PORT:-4000}:80"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  # Frontend (using Dockerfile)
  frontend:
    build:
      context: ../
      dockerfile: frontend/Dockerfile
    container_name: fos-frontend
    env_file:
      - ../.env
    environment:
      - VITE_FOS_API_URL=http://backend:80
      - NODE_ENV=${NODE_ENV:-production}
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:

# Networks (optional, for custom networking)
networks:
  default:
    name: fos-network